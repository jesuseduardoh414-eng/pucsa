<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cotizador · PUCSA Maquinaria</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#15191e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PUCSA Maquinaria">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icono-192.png">
<link rel="apple-touch-icon" href="assets/icono-180.png">
<link rel="stylesheet" href="app.css">
<script>
  // El tema elegido antes de pintar, para que no parpadee.
  try { var t = localStorage.getItem('pucsa-tema'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<noscript>Este cotizador necesita JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
